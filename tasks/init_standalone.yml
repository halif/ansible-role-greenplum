---
- name: Standalone create SSH directory for gpadmin
  ansible.builtin.file:
    path: "/home/{{ gp_user }}/.ssh"
    state: directory
    owner: "{{ gp_user }}"
    group: "{{ gp_group }}"
    mode: '0700'

- name: Standalone read generated SSH public key
  ansible.builtin.slurp:
    src: "/home/{{ gp_user }}/.ssh/id_rsa.pub"
  register: gp_user_pub_key

- name: Standalone add SSH key to authorized_keys for self-access
  ansible.posix.authorized_key:
    user: "{{ gp_user }}"
    state: present
    key: "{{ gp_user_pub_key.content | b64decode }}"

- name: Standalone create directories for data
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ gp_user }}"
    group: "{{ gp_group }}"
    mode: '0700'
  loop: "{{ [gp_master_data_dir] + gp_segment_data_dirs }}"

- name: Standalone generate the gpinitsystem configuration file
  ansible.builtin.template:
    src: gpinitsystem_standalone.j2
    dest: "/home/{{ gp_user }}/gpinitsystem_config"
    owner: "{{ gp_user }}"
    group: "{{ gp_group }}"
    mode: '0644'

- name: Standalone run gpinitsystem initialization
  ansible.builtin.command: >
    gpinitsystem -a -c /home/{{ gp_user }}/gpinitsystem_config
  become: true
  become_user: "{{ gp_user }}"
  args:
    creates: "{{ gp_master_data_dir }}/gpseg-1"