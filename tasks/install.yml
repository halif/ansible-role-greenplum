---
- name: Load system variables for the OS family
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install system dependencies for Greenplum
  ansible.builtin.package:
    name: "{{ gp_required_packages }}"
    state: present

- name: Install Greenplum (for RedHat family)
  ansible.builtin.dnf:
    name: "{{ gp_package_url_or_path }}"
    state: present
  when: ansible_os_family == 'RedHat' and gp_package_url_or_path is defined

- name: Install Greenplum (for Debian family)
  ansible.builtin.apt:
    deb: "{{ gp_package_url_or_path }}"
    state: present
  when: ansible_os_family == 'Debian' and gp_package_url_or_path is defined

- name: Verify and configure permissions for the Greenplum directory
  ansible.builtin.file:
    path: "{{ gp_home }}"
    state: directory
    owner: "{{ gp_user }}"
    group: "{{ gp_group }}"
    mode: '0755'
