name: CI (Molecule & Lint)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies for linting
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint
          ansible-galaxy collection install ansible.posix community.general community.docker
          if [ -f meta/requirements.yml ]; then
            ansible-galaxy collection install -r meta/requirements.yml
          fi

      - name: Run ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro:
          - almalinux8
          - ubuntu22

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies for Molecule
        run: |
          python -m pip install --upgrade pip
          pip install molecule molecule-plugins[docker] docker requests ansible-core
          ansible-galaxy collection install ansible.posix community.general community.docker
          if [ -f meta/requirements.yml ]; then
            ansible-galaxy collection install -r meta/requirements.yml
          fi

      - name: Run Molecule test
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
