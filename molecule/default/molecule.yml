---
driver:
  name: docker

platforms:
  - name: almalinux8-standalone
    image: "almalinux:8"
    command: "/usr/sbin/init"
    user: root
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

  - name: ubuntu22-standalone
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    command: "/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        gp_deployment_mode: "standalone"

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
