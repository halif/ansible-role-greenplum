---
driver:
  name: docker
platforms:
  - name: "${MOLECULE_DISTRO:-almalinux8}-standalone"
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-almalinux8}-ansible:latest"
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        gp_deployment_mode: "standalone"
verifier:
  name: ansible