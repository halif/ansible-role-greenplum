---
driver:
  name: docker

platforms:
  - name: almalinux8-standalone
    image: "almalinux:8"
    override_command: false
    command: "/usr/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

  - name: ubuntu22-standalone
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    override_command: false
    command: "/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../"
  options:
    user: root

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
